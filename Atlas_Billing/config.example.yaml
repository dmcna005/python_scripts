mongo:
  # Prefer the environment variable for the URI because it normally contains credentials.
  uri_env: MONGODB_ATLAS_BILLING_URI
  database: billing-billing
  line_items_collection: lineItems
  invoices_collection: invoices
  org_info_collection: orgInfo
  # Optional MQL $match filter applied to lineItems before invoice/org lookups.
  query: {}

email:
  enabled: true
  smtp_host: smtp.example.com
  smtp_port: 25
  use_tls: false
  use_ssl: false
  username: null
  password_env: null
  sender: billing-reports@example.com
  recipients:
    - recipient@example.com
  subject: MongoDB Atlas billing report

report:
  output_dir: output_reports
  # Leave null to use the latest billed date in the data.
  report_date: null
  top_n: 15
  renewal_buffer: 0.10